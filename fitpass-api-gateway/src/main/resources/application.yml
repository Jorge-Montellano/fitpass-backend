spring:
  application:
    name: fitpass-api-gateway

  cloud:
    gateway:
      server:
        webflux:
          routes:

            # BOOKING MICROSERVICE
            - id: booking-service
              uri: http://localhost:8082
              predicates:
                - Path=/api/bookings/**

            # MODULAR MONOLITH
            - id: fitpass-backend
              uri: http://localhost:8081
              predicates:
                - Path=/api/**

server:
  port: 8090