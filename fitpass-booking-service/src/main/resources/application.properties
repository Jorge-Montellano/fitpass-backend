spring.application.name=fitpass-booking-service

server.port=8082

# PostgreSQL - Booking DB
spring.datasource.url=jdbc:postgresql://localhost:5432/fitpass_booking
spring.datasource.username=admin
spring.datasource.password=123456

spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# RabbitMQ
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=fitpass
spring.rabbitmq.password=fitpass

# Actuator
management.endpoints.web.exposure.include=health,info